# Example book for AI Book Forge: three source files about a fictional CLI, built end to end.
title: "Brewlog in Practice"
subtitle: "Logging Coffee Brews from the Command Line"
author: "AI Book Forge Example"
lang: en-US
license: "CC BY 4.0"
description: >
  A short example book generated by AI Book Forge from three markdown files describing
  Brewlog, a fictional command-line coffee journal.
subject: "Software tools; Coffee"
profile: technical-handson

voice:
  audience: "home coffee brewers comfortable with a terminal"
  person: second
  tone: "friendly, direct, and precise"
  rules:
    - "American English"
    - "No emoji"
    - "No em-dashes"
  terminology:
    Brewlog: "Brewlog (the tool) and `brewlog` (the command)"
    brew: "brew (one logged cup or pot)"

targets:
  words_per_chapter: [600, 2500]
  min_diagrams: 2

companion_project:
  name: "The Morning Journal"
  path: ""
  description: >
    The reader builds one Brewlog journal across the book: register a bean, log a week of V60 brews
    while changing one variable at a time, then tune config.toml and export the results.

cover:
  colors: ["#3b1f0e", "#b45309"]
  tagline: "An AI Book Forge example"

glossary:
  brew: "One logged cup or pot, recorded with a method, a bean, a dose, a water weight, a grind setting, a water temperature, a brew time, and a rating from 1 to 5."
  bean: "A named coffee you buy, with a roaster and a roast date, that brews refer to by name."
  method: "How a brew is made: `v60`, `aeropress`, `french-press`, `espresso`, or `moka`."
  ratio: "Water weight divided by dose, computed by Brewlog and shown in a form like `1:16`."
  journal folder: "The folder Brewlog keeps its data in, `~/.brewlog/` by default, which holds `journal.jsonl` and `config.toml`."
  journal.jsonl: "The journal file inside the journal folder, holding one JSON object per brew, appended and never rewritten in place."
  revision: "A new version of a brew appended by `brewlog edit` with the same id and a higher `rev` number; Brewlog shows the latest one."
  config.toml: "The optional settings file in the journal folder that supplies defaults such as `default_method`, `default_ratio`, and `default_temp`."
  precedence: "The order Brewlog uses to pick each setting: command-line option, then environment variable, then `config.toml`, then the built-in default."

exclude_sources: []

appendices:
  - { id: A, title: "Glossary", generate: glossary }
  - { id: B, title: "Quiz Answers", generate: quiz }

parts:
  - title: "The Morning Journal"
    intro: >
      This part takes you from installing Brewlog to a tuned, exportable journal. You start with
      the ideas behind a brew and the journal folder, then log and compare a week of V60 brews
      while changing one variable at a time, and finish by setting your own defaults in
      config.toml and fixing the problems you are most likely to hit.
    chapters:
      - title: "Getting Started with Brewlog"
        slug: getting-started
        summary: >
          Why Brewlog exists, how to install it, and the core ideas (brew, bean, method, ratio)
          plus how a brew is recorded in journal.jsonl with append-only revisions. This chapter
          owns the concepts; it runs only `brewlog --version` and leaves the full command
          reference to Chapter 2 and configuration to Chapter 3.
        sources: [overview]
        prereqs: []
        template: light
      - title: "Logging and Comparing Brews"
        slug: logging-brews
        summary: >
          The complete command set: `brewlog bean add`, `add` with every option and its
          validation rules, `list`, `edit`, `best`, and `export`, plus the shared `--journal`
          option. The reader registers a bean, logs a week of V60 brews changing one variable
          at a time, and exports the results. Defaults are named here but explained in Chapter 3.
        sources: [commands]
        prereqs: [1]
        template: full
      - title: "Configuring and Troubleshooting Brewlog"
        slug: configuration
        summary: >
          Every `config.toml` key and its default, the `BREWLOG_JOURNAL` and `NO_COLOR`
          environment variables, the precedence order for settings, and troubleshooting
          (unknown bean, invalid config key, corrupt journal lines). The reader tunes their
          own defaults and sees how they change `brewlog add`. This is the only chapter that
          teaches configuration and precedence.
        sources: [config]
        prereqs: [1, 2]
        template: full
