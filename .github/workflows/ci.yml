name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PANDOC_VERSION: "3.6.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install tools
        run: |
          pip install pyyaml
          wget -q https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb
          sudo dpkg -i pandoc-${PANDOC_VERSION}-1-amd64.deb
          sudo apt-get update && sudo apt-get install -y epubcheck
          npm install -g @mermaid-js/mermaid-cli@12.0.0
      - name: Unit tests
        run: make test
      - name: Build the example book
        run: make all BOOK=examples/tiny-book
      - name: Validate the EPUB
        run: epubcheck examples/tiny-book/dist/brewlog-in-practice.epub
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-book
          path: examples/tiny-book/dist/
